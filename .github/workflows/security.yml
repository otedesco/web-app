name: Security

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions: {}

jobs:
  security:
    name: Security / aggregate
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      packages: read
    uses: otedesco/gh-action-templates/.github/workflows/security.yml@09dcf472cfd6216b73f3f6417682da20290a00db # OPS-186 npm-aware central workflow
    with:
      package-manager: npm
