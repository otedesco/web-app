name: Security

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions: {}

jobs:
  security:
    name: Security / aggregate
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      packages: read
      packages: read
    uses: otedesco/gh-action-templates/.github/workflows/security.yml@0744378d42b14fa3dc7bd2073cc8b54e75f90749 # OPS-186 npm-aware central workflow
    with:
      package-manager: npm
