name: Security

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions: {}

jobs:
  security:
    name: Security / aggregate
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      packages: read
    uses: otedesco/gh-action-templates/.github/workflows/security.yml@1ff2338701930c90d43887953e2827bef2f7bbc0 # OPS-186 npm-aware central workflow
    with:
      package-manager: npm
