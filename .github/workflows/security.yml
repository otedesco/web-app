name: Security

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions: {}

jobs:
  security:
    name: Security / aggregate
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      packages: read
    uses: otedesco/gh-action-templates/.github/workflows/security.yml@f955d5f8e308d5eb351a29549a3fcd3f85dcf0e7 # OPS-186 npm-aware security workflow
    with:
      package-manager: npm
