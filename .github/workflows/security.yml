name: Security

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions: {}

jobs:
  security:
    name: Security / aggregate
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      packages: read
    uses: otedesco/gh-action-templates/.github/workflows/security.yml@c4460e6004042ec238a7fe3d1d81905ec7846bba # OPS-186 npm-aware central workflow
    with:
      package-manager: npm
